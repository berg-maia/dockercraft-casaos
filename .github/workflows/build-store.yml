name: Build ArtCraft Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build CasaOS App Store
        uses: IceWhaleTech/build-appstore-action@main
        with:
          source: .
          output: dist
          report-json: out/build-report.json

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-report
          path: out/build-report.json
          if-no-files-found: warn

      - name: Upload store
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artcraft-store
          path: dist
          if-no-files-found: error
