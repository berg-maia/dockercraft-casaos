name: Atualizar versões da loja

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Atualizar version, update_at e image de cada app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_versions.py

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Apps
            git commit -m "chore: atualizar versões dos apps"
            git push
          else
            echo "Nada para atualizar."
          fi
