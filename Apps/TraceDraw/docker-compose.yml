name: tracedraw

services:
  tracedraw:
    image: ghcr.io/berg-maia/tracedraw-web:0.42.1
    container_name: tracedraw
    restart: unless-stopped
    ports:
      - "8316:80"
    volumes:
      - /DATA/AppData/$AppID/fonts:/usr/share/nginx/html/fonts
    command:
      - sh
      - -c
      - |
        wget -qO /tmp/fonts-json.sh https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/scripts/fonts-json.sh && mv /tmp/fonts-json.sh /opt/fonts-json.sh || echo "could not download fonts-json.sh"
        [ -f /opt/fonts-json.sh ] && sh /opt/fonts-json.sh &
        exec nginx -g 'daemon off;'
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.tracedraw
  architectures:
    - amd64
    - arm64
  main: tracedraw
  author: TraceDraw
  developer: TraceDraw
  category: Media
