name: vectorcraft

services:
  vectorcraft:
    image: ghcr.io/berg-maia/vectorcraft-web:0.14.0
    container_name: vectorcraft
    restart: unless-stopped
    ports:
      - "8766:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.vectorcraft
  architectures:
    - amd64
    - arm64
  main: vectorcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: VectorCraft
  tagline:
    en_US: "Vector illustration"
    zh_CN: "矢量插画"
    ar_SA: "الرسم التوضيحي المتجهي"
    de_DE: "Vektorillustration"
    es_ES: "Ilustración vectorial"
    fr_FR: "Illustration vectorielle"
    hu_HU: "Vektorgrafikus illusztráció"
    it_IT: "Illustrazione vettoriale"
    ru_RU: "Векторная иллюстрация"
    pl_PL: "Ilustracja wektorowa"
    pt_BR: "Ilustração vetorial"
    sv_SE: "Vektorillustration"
    uk_UA: "Векторна ілюстрація"
  description:
    en_US: "Vector illustration; an open-source, clean-room reimplementation of Adobe Illustrator, rebuilt in pure Rust."
    zh_CN: "矢量插画；Adobe Illustrator 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "الرسم التوضيحي المتجهي؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe Illustrator، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Vektorillustration; eine quelloffene Clean-Room-Neuimplementierung von Adobe Illustrator, komplett in reinem Rust neu aufgebaut."
    es_ES: "Ilustración vectorial; una reimplementación de código abierto, tipo «clean-room», de Adobe Illustrator, reconstruida en Rust puro."
    fr_FR: "Illustration vectorielle ; une réimplémentation open source « clean-room » d'Adobe Illustrator, reconstruite en Rust pur."
    hu_HU: "Vektorgrafikus illusztráció; Adobe Illustrator nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Illustrazione vettoriale; una reimplementazione open source «clean-room» di Adobe Illustrator, ricostruita in puro Rust."
    ru_RU: "Векторная иллюстрация; открытая clean-room-реимплементация Adobe Illustrator, заново написанная на чистом Rust."
    pl_PL: "Ilustracja wektorowa; otwartoźródłowa reimplementacja „clean-room” programu Adobe Illustrator, napisana od nowa w czystym Rust."
    pt_BR: "Ilustração vetorial; uma reimplementação open source, em clean-room, do Adobe Illustrator, reconstruída em Rust puro."
    sv_SE: "Vektorillustration; en open source-reimplementering av Adobe Illustrator enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Векторна ілюстрація; відкрита clean-room-реімплементація Adobe Illustrator, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/VectorCraft/icon.svg
  screenshot_link:
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/VectorCraft/screenshot-1.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/VectorCraft/screenshot-2.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/VectorCraft/screenshot-3.png
  website: https://getartcraft.com/apps/vectorcraft
  repo: https://github.com/storytold/vectorcraft
  support: https://github.com/storytold/vectorcraft/issues
  version: "0.14.0"
  update_at: "2026-10-21"
  index: /
  port_map: "8766"
  scheme: http
