    ar_SA: "العروض التقديمية وعروض الشرائح؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Microsoft PowerPoint، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Präsentationen und Diashows; eine quelloffene Clean-Room-Neuimplementierung von Microsoft PowerPoint, komplett in reinem Rust neu aufgebaut."
    es_ES: "Presentaciones y diapositivas; una reimplementación de código abierto, tipo «clean-room», de Microsoft PowerPoint, reconstruida en Rust puro."
    fr_FR: "Présentations et diaporamas ; une réimplémentation open source « clean-room » de Microsoft PowerPoint, reconstruite en Rust pur."
    hu_HU: "Prezentációk és diavetítések; Microsoft PowerPoint nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Presentazioni e slide show; una reimplementazione open source «clean-room» di Microsoft PowerPoint, ricostruita in puro Rust."
    ru_RU: "Презентации и слайд-шоу; открытая clean-room-реимплементация Microsoft PowerPoint, заново написанная на чистом Rust."
    pl_PL: "Prezentacje i pokazy slajdów; otwartoźródłowa reimplementacja „clean-room” programu Microsoft PowerPoint, napisana od nowa w czystym Rust."
    pt_BR: "Apresentações e slides; uma reimplementação open source, em clean-room, do Microsoft PowerPoint, reconstruída em Rust puro."
    sv_SE: "Presentationer och bildspel; en open source-reimplementering av Microsoft PowerPoint enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Презентації та слайд-шоу; відкрита clean-room-реімплементація Microsoft PowerPoint, заново написана на чистому Rust."
