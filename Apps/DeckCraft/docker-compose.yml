name: deckcraft

services:
  deckcraft:
    image: ghcr.io/berg-maia/deckcraft-web:0.12.0
    container_name: deckcraft
    restart: unless-stopped
    ports:
      - "8775:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.deckcraft
  architectures:
    - amd64
    - arm64
  main: deckcraft
  author: ArtCraft
  developer: ArtCraft
  category: Productivity
  title:
    en_US: DeckCraft
  tagline:
    en_US: "Presentations and slide shows"
    zh_CN: "演示文稿与幻灯片放映"
    ar_SA: "العروض التقديمية وعروض الشرائح"
    de_DE: "Präsentationen und Diashows"
    es_ES: "Presentaciones y diapositivas"
    fr_FR: "Présentations et diaporamas"
    hu_HU: "Prezentációk és diavetítések"
    it_IT: "Presentazioni e slide show"
    ru_RU: "Презентации и слайд-шоу"
    pl_PL: "Prezentacje i pokazy slajdów"
    pt_BR: "Apresentações e slides"
    sv_SE: "Presentationer och bildspel"
    uk_UA: "Презентації та слайд-шоу"
