name: solidcraft

services:
  solidcraft:
    image: ghcr.io/berg-maia/solidcraft-web:0.14.0
    container_name: solidcraft
    restart: unless-stopped
    ports:
      - "8778:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

