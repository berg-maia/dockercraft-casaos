name: cromaforge

services:
  cromaforge:
    image: ghcr.io/berg-maia/cromaforge-web:0.17.0
    container_name: cromaforge
    restart: unless-stopped
    ports:
      - "8315:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.cromaforge
  architectures:
    - amd64
    - arm64
  main: cromaforge
  author: emmertex
  developer: emmertex
  category: Media
  title:
    en_US: Cromaforge
  tagline:
