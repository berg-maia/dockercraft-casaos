name: effectcraft

services:
  effectcraft:
    image: ghcr.io/berg-maia/effectcraft-web:0.13.0
    container_name: effectcraft
    restart: unless-stopped
    ports:
      - "8770:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.effectcraft
  architectures:
    - amd64
    - arm64
  main: effectcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: EffectCraft
  tagline:
    en_US: "Motion graphics and visual effects"
    zh_CN: "动态图形与视觉特效"
    ar_SA: "الرسوم المتحركة والمؤثرات البصرية"
    de_DE: "Motion Graphics und visuelle Effekte"
    es_ES: "Motion graphics y efectos visuales"
    fr_FR: "Motion design et effets visuels"
    hu_HU: "Motion graphics és vizuális effektek"
    it_IT: "Motion graphics ed effetti visivi"
    ru_RU: "Моушн-графика и визуальные эффекты"
    pl_PL: "Motion graphics i efekty wizualne"
    pt_BR: "Motion graphics e efeitos visuais"
    sv_SE: "Motion graphics och visuella effekter"
    uk_UA: "Моушн-графіка та візуальні ефекти"
  description:
    en_US: "Motion graphics and visual effects; an open-source, clean-room reimplementation of Adobe After Effects, rebuilt in pure Rust."
    zh_CN: "动态图形与视觉特效；Adobe After Effects 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "الرسوم المتحركة والمؤثرات البصرية؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe After Effects، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Motion Graphics und visuelle Effekte; eine quelloffene Clean-Room-Neuimplementierung von Adobe After Effects, komplett in reinem Rust neu aufgebaut."
    es_ES: "Motion graphics y efectos visuales; una reimplementación de código abierto, tipo «clean-room», de Adobe After Effects, reconstruida en Rust puro."
    fr_FR: "Motion design et effets visuels ; une réimplémentation open source « clean-room » d'Adobe After Effects, reconstruite en Rust pur."
    hu_HU: "Motion graphics és vizuális effektek; Adobe After Effects nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Motion graphics ed effetti visivi; una reimplementazione open source «clean-room» di Adobe After Effects, ricostruita in puro Rust."
    ru_RU: "Моушн-графика и визуальные эффекты; открытая clean-room-реимплементация Adobe After Effects, заново написанная на чистом Rust."
    pl_PL: "Motion graphics i efekty wizualne; otwartoźródłowa reimplementacja „clean-room” programu Adobe After Effects, napisana od nowa w czystym Rust."
    pt_BR: "Motion graphics e efeitos visuais; uma reimplementação open source, em clean-room, do Adobe After Effects, reconstruída em Rust puro."
    sv_SE: "Motion graphics och visuella effekter; en open source-reimplementering av Adobe After Effects enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Моушн-графіка та візуальні ефекти; відкрита clean-room-реімплементація Adobe After Effects, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/EffectCraft/icon.svg
  screenshot_link:
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/EffectCraft/screenshot-1.png
