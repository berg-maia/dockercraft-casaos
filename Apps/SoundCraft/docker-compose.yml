name: soundcraft

services:
  soundcraft:
    image: ghcr.io/berg-maia/soundcraft-web:0.8.0
    container_name: soundcraft
    restart: unless-stopped
    ports:
      - "8774:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.soundcraft
  architectures:
    - amd64
    - arm64
  main: soundcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: SoundCraft
  tagline:
    en_US: "Recording, editing and mixing audio"
    zh_CN: "音频录制、编辑与混音"
    ar_SA: "تسجيل الصوت وتحريره ومزجه"
    de_DE: "Audio aufnehmen, bearbeiten und mischen"
    es_ES: "Grabación, edición y mezcla de audio"
    fr_FR: "Enregistrement, édition et mixage audio"
    hu_HU: "Hangfelvétel, szerkesztés és keverés"
    it_IT: "Registrazione, editing e missaggio audio"
    ru_RU: "Запись, редактирование и сведение звука"
    pl_PL: "Nagrywanie, edycja i miksowanie dźwięku"
    pt_BR: "Gravação, edição e mixagem de áudio"
    sv_SE: "Inspelning, redigering och mixning av ljud"
    uk_UA: "Запис, редагування та зведення звуку"
  description:
    en_US: "Recording, editing and mixing audio; an open-source, clean-room reimplementation of Avid Pro Tools, rebuilt in pure Rust."
    zh_CN: "音频录制、编辑与混音；Avid Pro Tools 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "تسجيل الصوت وتحريره ومزجه؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Avid Pro Tools، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Audio aufnehmen, bearbeiten und mischen; eine quelloffene Clean-Room-Neuimplementierung von Avid Pro Tools, komplett in reinem Rust neu aufgebaut."
    es_ES: "Grabación, edición y mezcla de audio; una reimplementación de código abierto, tipo «clean-room», de Avid Pro Tools, reconstruida en Rust puro."
    fr_FR: "Enregistrement, édition et mixage audio ; une réimplémentation open source « clean-room » d'Avid Pro Tools, reconstruite en Rust pur."
    hu_HU: "Hangfelvétel, szerkesztés és keverés; Avid Pro Tools nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Registrazione, editing e missaggio audio; una reimplementazione open source «clean-room» di Avid Pro Tools, ricostruita in puro Rust."
    ru_RU: "Запись, редактирование и сведение звука; открытая clean-room-реимплементация Avid Pro Tools, заново написанная на чистом Rust."
    pl_PL: "Nagrywanie, edycja i miksowanie dźwięku; otwartoźródłowa reimplementacja „clean-room” programu Avid Pro Tools, napisana od nowa w czystym Rust."
    pt_BR: "Gravação, edição e mixagem de áudio; uma reimplementação open source, em clean-room, do Avid Pro Tools, reconstruída em Rust puro."
    sv_SE: "Inspelning, redigering och mixning av ljud; en open source-reimplementering av Avid Pro Tools enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Запис, редагування та зведення звуку; відкрита clean-room-реімплементація Avid Pro Tools, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/SoundCraft/icon.svg
  screenshot_link:
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/SoundCraft/screenshot-1.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/SoundCraft/screenshot-2.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/SoundCraft/screenshot-3.png
  website: https://getartcraft.com/apps/soundcraft
  repo: https://github.com/storytold/soundcraft
  support: https://github.com/storytold/soundcraft/issues
  version: "0.8.0"
  update_at: "2026-10-17"
  index: /
  port_map: "8774"
  scheme: http
