name: photocraft

services:
  photocraft:
    image: ghcr.io/berg-maia/photocraft-web:0.10.0
    container_name: photocraft
    restart: unless-stopped
    ports:
      - "8765:80"
      
    volumes:
      - /DATA/AppData/ArtCraft/$AppID/fonts:/usr/share/nginx/html/fonts
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"
   
   command: ["sh", "-c", "wget -qO /tmp/fonts-manifest.sh https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/scripts/fonts-manifest.sh && mv /tmp/fonts-manifest.sh /opt/fonts-manifest.sh; sh /opt/fonts-manifest.sh & exec nginx -g 'daemon off;'"]

x-casaos:
  id: io.github.berg-maia.photocraft
  architectures:
    - amd64
    - arm64
  main: photocraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: PhotoCraft
  tagline:
    en_US: "Image editing"
    zh_CN: "图像编辑"
    ar_SA: "تحرير الصور"
    de_DE: "Bildbearbeitung"
    es_ES: "Edición de imágenes"
    fr_FR: "Retouche d'images"
    hu_HU: "Képszerkesztés"
    it_IT: "Editing di immagini"
    ru_RU: "Редактирование изображений"
    pl_PL: "Edycja obrazów"
    pt_BR: "Edição de imagens"
    sv_SE: "Bildredigering"
    uk_UA: "Редагування зображень"
  description:
    en_US: "Image editing; an open-source, clean-room reimplementation of Adobe Photoshop, rebuilt in pure Rust."
    zh_CN: "图像编辑；Adobe Photoshop 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "تحرير الصور؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe Photoshop، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Bildbearbeitung; eine quelloffene Clean-Room-Neuimplementierung von Adobe Photoshop, komplett in reinem Rust neu aufgebaut."
    es_ES: "Edición de imágenes; una reimplementación de código abierto, tipo «clean-room», de Adobe Photoshop, reconstruida en Rust puro."
    fr_FR: "Retouche d'images ; une réimplémentation open source « clean-room » d'Adobe Photoshop, reconstruite en Rust pur."
    hu_HU: "Képszerkesztés; Adobe Photoshop nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Editing di immagini; una reimplementazione open source «clean-room» di Adobe Photoshop, ricostruita in puro Rust."
    ru_RU: "Редактирование изображений; открытая clean-room-реимплементация Adobe Photoshop, заново написанная на чистом Rust."
    pl_PL: "Edycja obrazów; otwartoźródłowa reimplementacja „clean-room” programu Adobe Photoshop, napisana od nowa w czystym Rust."
    pt_BR: "Edição de imagens; uma reimplementação open source, em clean-room, do Adobe Photoshop, reconstruída em Rust puro."
    sv_SE: "Bildredigering; en open source-reimplementering av Adobe Photoshop enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Редагування зображень; відкрита clean-room-реімплементація Adobe Photoshop, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/PhotoCraft/icon.svg
  screenshot_link:
    - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/PhotoCraft/screenshot-1.webp
    - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/PhotoCraft/screenshot-2.webp
    - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/PhotoCraft/screenshot-3.webp
