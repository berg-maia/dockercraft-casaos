     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/FilmCraft/screenshot-1.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/FilmCraft/screenshot-2.png
