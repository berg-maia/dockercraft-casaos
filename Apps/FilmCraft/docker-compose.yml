name: filmcraft

services:
  filmcraft:
    image: ghcr.io/berg-maia/filmcraft-web:0.8.0
    container_name: filmcraft
    restart: unless-stopped
    ports:
      - "8767:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.filmcraft
  architectures:
    - amd64
    - arm64
  main: filmcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: FilmCraft
  tagline:
    en_US: "Video editing, color and sound"
    zh_CN: "视频剪辑、调色与音频"
    ar_SA: "تحرير الفيديو والألوان والصوت"
    de_DE: "Videobearbeitung, Farbe und Ton"
    es_ES: "Edición de vídeo, color y sonido"
    fr_FR: "Montage vidéo, étalonnage et son"
    hu_HU: "Videószerkesztés, színkezelés és hang"
    it_IT: "Montaggio video, colore e audio"
    ru_RU: "Видеомонтаж, цвет и звук"
    pl_PL: "Edycja wideo, koloru i dźwięku"
    pt_BR: "Edição de vídeo, cor e som"
    sv_SE: "Videoredigering, färg och ljud"
    uk_UA: "Відеомонтаж, колір і звук"
  description:
    en_US: "Video editing, color and sound; an open-source, clean-room reimplementation of Adobe Premiere Pro, rebuilt in pure Rust."
    zh_CN: "视频剪辑、调色与音频；Adobe Premiere Pro 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "تحرير الفيديو والألوان والصوت؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe Premiere Pro، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Videobearbeitung, Farbe und Ton; eine quelloffene Clean-Room-Neuimplementierung von Adobe Premiere Pro, komplett in reinem Rust neu aufgebaut."
    es_ES: "Edición de vídeo, color y sonido; una reimplementación de código abierto, tipo «clean-room», de Adobe Premiere Pro, reconstruida en Rust puro."
    fr_FR: "Montage vidéo, étalonnage et son ; une réimplémentation open source « clean-room » d'Adobe Premiere Pro, reconstruite en Rust pur."
    hu_HU: "Videószerkesztés, színkezelés és hang; Adobe Premiere Pro nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Montaggio video, colore e audio; una reimplementazione open source «clean-room» di Adobe Premiere Pro, ricostruita in puro Rust."
    ru_RU: "Видеомонтаж, цвет и звук; открытая clean-room-реимплементация Adobe Premiere Pro, заново написанная на чистом Rust."
    pl_PL: "Edycja wideo, koloru i dźwięku; otwartoźródłowa reimplementacja „clean-room” programu Adobe Premiere Pro, napisana od nowa w czystym Rust."
    pt_BR: "Edição de vídeo, cor e som; uma reimplementação open source, em clean-room, do Adobe Premiere Pro, reconstruída em Rust puro."
    sv_SE: "Videoredigering, färg och ljud; en open source-reimplementering av Adobe Premiere Pro enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Відеомонтаж, колір і звук; відкрита clean-room-реімплементація Adobe Premiere Pro, заново написана на чистому Rust."
