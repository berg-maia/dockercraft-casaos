name: designcraft

services:
  designcraft:
    image: ghcr.io/berg-maia/designcraft-web:0.8.0
    container_name: designcraft
    restart: unless-stopped
    ports:
      - "8771:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.designcraft
  architectures:
    - amd64
    - arm64
  main: designcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: DesignCraft
  tagline:
    en_US: "Page layout and publishing"
    zh_CN: "排版与出版"
    ar_SA: "تنسيق الصفحات والنشر"
    de_DE: "Seitenlayout und Veröffentlichung"
    es_ES: "Maquetación y publicación"
    fr_FR: "Mise en page et publication"
    hu_HU: "Oldalszerkesztés és kiadás"
    it_IT: "Impaginazione e pubblicazione"
    ru_RU: "Верстка и публикация"
    pl_PL: "Skład i publikacja"
    pt_BR: "Diagramação e publicação"
    sv_SE: "Sidlayout och publicering"
    uk_UA: "Верстка та публікація"
  description:
    en_US: "Page layout and publishing; an open-source, clean-room reimplementation of Adobe InDesign, rebuilt in pure Rust."
    zh_CN: "排版与出版；Adobe InDesign 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "تنسيق الصفحات والنشر؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe InDesign، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Seitenlayout und Veröffentlichung; eine quelloffene Clean-Room-Neuimplementierung von Adobe InDesign, komplett in reinem Rust neu aufgebaut."
    es_ES: "Maquetación y publicación; una reimplementación de código abierto, tipo «clean-room», de Adobe InDesign, reconstruida en Rust puro."
    fr_FR: "Mise en page et publication ; une réimplémentation open source « clean-room » d'Adobe InDesign, reconstruite en Rust pur."
    hu_HU: "Oldalszerkesztés és kiadás; Adobe InDesign nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Impaginazione e pubblicazione; una reimplementazione open source «clean-room» di Adobe InDesign, ricostruita in puro Rust."
    ru_RU: "Верстка и публикация; открытая clean-room-реимплементация Adobe InDesign, заново написанная на чистом Rust."
    pl_PL: "Skład i publikacja; otwartoźródłowa reimplementacja „clean-room” programu Adobe InDesign, napisana od nowa w czystym Rust."
    pt_BR: "Diagramação e publicação; uma reimplementação open source, em clean-room, do Adobe InDesign, reconstruída em Rust puro."
    sv_SE: "Sidlayout och publicering; en open source-reimplementering av Adobe InDesign enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Верстка та публікація; відкрита clean-room-реімплементація Adobe InDesign, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/DesignCraft/icon.svg
  screenshot_link:
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/DesignCraft/screenshot-1.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/DesignCraft/screenshot-2.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/DesignCraft/screenshot-3.png
  website: https://getartcraft.com/apps/designcraft
  repo: https://github.com/storytold/designcraft
  support: https://github.com/storytold/designcraft/issues
  version: "0.8.0"
  update_at: "2026-10-14"
  index: /
  port_map: "8771"
  scheme: http
