  #   - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/DesignCraft/screenshot-2.webp
  #   - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/DesignCraft/screenshot-3.webp
  website: https://getartcraft.com/apps/designcraft
  repo: https://github.com/storytold/designcraft
  support: https://github.com/storytold/designcraft/issues
  index: /
  port_map: "8771"
  scheme: http
