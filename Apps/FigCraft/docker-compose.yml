name: figcraft

services:
  figcraft:
    image: ghcr.io/berg-maia/figcraft-web:0.6.0
    container_name: figcraft
    restart: unless-stopped
    ports:
      - "8772:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.figcraft
  architectures:
    - amd64
    - arm64
  main: figcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: FigCraft
  tagline:
    en_US: "Interface design"
    zh_CN: "界面设计"
    ar_SA: "تصميم الواجهات"
    de_DE: "Oberflächendesign"
    es_ES: "Diseño de interfaces"
    fr_FR: "Conception d'interfaces"
    hu_HU: "Felülettervezés"
    it_IT: "Progettazione di interfacce"
    ru_RU: "Дизайн интерфейсов"
    pl_PL: "Projektowanie interfejsów"
    pt_BR: "Design de interfaces"
    sv_SE: "Gränssnittsdesign"
    uk_UA: "Дизайн інтерфейсів"
  description:
    en_US: "Interface design; an open-source, clean-room reimplementation of Figma, rebuilt in pure Rust."
    zh_CN: "界面设计；Figma 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "تصميم الواجهات؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Figma، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Oberflächendesign; eine quelloffene Clean-Room-Neuimplementierung von Figma, komplett in reinem Rust neu aufgebaut."
    es_ES: "Diseño de interfaces; una reimplementación de código abierto, tipo «clean-room», de Figma, reconstruida en Rust puro."
    fr_FR: "Conception d'interfaces ; une réimplémentation open source « clean-room » de Figma, reconstruite en Rust pur."
    hu_HU: "Felülettervezés; Figma nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Progettazione di interfacce; una reimplementazione open source «clean-room» di Figma, ricostruita in puro Rust."
    ru_RU: "Дизайн интерфейсов; открытая clean-room-реимплементация Figma, заново написанная на чистом Rust."
    pl_PL: "Projektowanie interfejsów; otwartoźródłowa reimplementacja „clean-room” programu Figma, napisana od nowa w czystym Rust."
    pt_BR: "Design de interfaces; uma reimplementação open source, em clean-room, do Figma, reconstruída em Rust puro."
    sv_SE: "Gränssnittsdesign; en open source-reimplementering av Figma enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Дизайн інтерфейсів; відкрита clean-room-реімплементація Figma, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/FigCraft/icon.svg
  screenshot_link:
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/FigCraft/screenshot-1.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/FigCraft/screenshot-2.png
     - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/FigCraft/screenshot-3.png
  website: https://getartcraft.com/apps/figcraft
  repo: https://github.com/storytold/figcraft
  support: https://github.com/storytold/figcraft/issues
  version: "0.6.0"
  update_at: "2026-10-14"
  index: /
  port_map: "8772"
  scheme: http
