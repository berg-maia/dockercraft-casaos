name: cadcraft

services:
  cadcraft:
    image: ghcr.io/berg-maia/cadcraft-web:latest
    container_name: cadcraft
    restart: unless-stopped
    ports:
      - "8776:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.cadcraft
  architectures:
    - amd64
    - arm64
  main: cadcraft
  author: ArtCraft
  developer: ArtCraft
  category: Productivity
  title:
    en_US: CADCraft
  tagline:
    en_US: "Computer-aided design and drafting"
    zh_CN: "计算机辅助设计与绘图"
    ar_SA: "التصميم والرسم بمساعدة الحاسوب"
    de_DE: "Computergestütztes Konstruieren und Zeichnen"
    es_ES: "Diseño y dibujo asistidos por ordenador"
    fr_FR: "Conception et dessin assistés par ordinateur"
    hu_HU: "Számítógéppel segített tervezés és rajzolás"
    it_IT: "Progettazione e disegno assistiti da computer"
    ru_RU: "Автоматизированное проектирование и черчение"
    pl_PL: "Projektowanie i kreślenie wspomagane komputerowo"
    pt_BR: "Projeto e desenho assistidos por computador"
    sv_SE: "Datorstödd konstruktion och ritning"
    uk_UA: "Автоматизоване проєктування та креслення"
  description:
    en_US: "Computer-aided design and drafting; an open-source, clean-room reimplementation of Autodesk AutoCAD, rebuilt in pure Rust."
    zh_CN: "计算机辅助设计与绘图；Autodesk AutoCAD 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "التصميم والرسم بمساعدة الحاسوب؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Autodesk AutoCAD، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Computergestütztes Konstruieren und Zeichnen; eine quelloffene Clean-Room-Neuimplementierung von Autodesk AutoCAD, komplett in reinem Rust neu aufgebaut."
    es_ES: "Diseño y dibujo asistidos por ordenador; una reimplementación de código abierto, tipo «clean-room», de Autodesk AutoCAD, reconstruida en Rust puro."
    fr_FR: "Conception et dessin assistés par ordinateur ; une réimplémentation open source « clean-room » d'Autodesk AutoCAD, reconstruite en Rust pur."
    hu_HU: "Számítógéppel segített tervezés és rajzolás; Autodesk AutoCAD nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Progettazione e disegno assistiti da computer; una reimplementazione open source «clean-room» di Autodesk AutoCAD, ricostruita in puro Rust."
    ru_RU: "Автоматизированное проектирование и черчение; открытая clean-room-реимплементация Autodesk AutoCAD, заново написанная на чистом Rust."
    pl_PL: "Projektowanie i kreślenie wspomagane komputerowo; otwartoźródłowa reimplementacja „clean-room” programu Autodesk AutoCAD, napisana od nowa w czystym Rust."
    pt_BR: "Projeto e desenho assistidos por computador; uma reimplementação open source, em clean-room, do Autodesk AutoCAD, reconstruída em Rust puro."
    sv_SE: "Datorstödd konstruktion och ritning; en open source-reimplementering av Autodesk AutoCAD enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Автоматизоване проєктування та креслення; відкрита clean-room-реімплементація Autodesk AutoCAD, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/CADCraft/icon.svg
