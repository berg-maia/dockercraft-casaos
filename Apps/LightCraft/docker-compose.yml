name: lightcraft

services:
  lightcraft:
    image: ghcr.io/berg-maia/lightcraft-web:0.13.0
    container_name: lightcraft
    restart: unless-stopped
    ports:
      - "8768:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.lightcraft
  architectures:
    - amd64
    - arm64
  main: lightcraft
  author: ArtCraft
  developer: ArtCraft
  category: Media
  title:
    en_US: LightCraft
  tagline:
    en_US: "Photo library and raw development"
    zh_CN: "照片库与 RAW 处理"
    ar_SA: "مكتبة الصور وتحميض RAW"
    de_DE: "Fotobibliothek und RAW-Entwicklung"
    es_ES: "Biblioteca de fotos y revelado RAW"
    fr_FR: "Photothèque et développement RAW"
    hu_HU: "Fotótár és RAW-előhívás"
    it_IT: "Libreria foto e sviluppo RAW"
    ru_RU: "Фотобиблиотека и обработка RAW"
    pl_PL: "Biblioteka zdjęć i wywoływanie RAW"
    pt_BR: "Biblioteca de fotos e revelação RAW"
    sv_SE: "Fotobibliotek och RAW-framkallning"
    uk_UA: "Фотобібліотека та обробка RAW"
  description:
    en_US: "Photo library and raw development; an open-source, clean-room reimplementation of Adobe Lightroom, rebuilt in pure Rust."
    zh_CN: "照片库与 RAW 处理；Adobe Lightroom 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "مكتبة الصور وتحميض RAW؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe Lightroom، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Fotobibliothek und RAW-Entwicklung; eine quelloffene Clean-Room-Neuimplementierung von Adobe Lightroom, komplett in reinem Rust neu aufgebaut."
    es_ES: "Biblioteca de fotos y revelado RAW; una reimplementación de código abierto, tipo «clean-room», de Adobe Lightroom, reconstruida en Rust puro."
    fr_FR: "Photothèque et développement RAW ; une réimplémentation open source « clean-room » d'Adobe Lightroom, reconstruite en Rust pur."
    hu_HU: "Fotótár és RAW-előhívás; Adobe Lightroom nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Libreria foto e sviluppo RAW; una reimplementazione open source «clean-room» di Adobe Lightroom, ricostruita in puro Rust."
    ru_RU: "Фотобиблиотека и обработка RAW; открытая clean-room-реимплементация Adobe Lightroom, заново написанная на чистом Rust."
    pl_PL: "Biblioteka zdjęć i wywoływanie RAW; otwartoźródłowa reimplementacja „clean-room” programu Adobe Lightroom, napisana od nowa w czystym Rust."
    pt_BR: "Biblioteca de fotos e revelação RAW; uma reimplementação open source, em clean-room, do Adobe Lightroom, reconstruída em Rust puro."
    sv_SE: "Fotobibliotek och RAW-framkallning; en open source-reimplementering av Adobe Lightroom enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Фотобібліотека та обробка RAW; відкрита clean-room-реімплементація Adobe Lightroom, заново написана на чистому Rust."
