name: pdfcraft

services:
  pdfcraft:
    image: ghcr.io/berg-maia/pdfcraft-web:latest
    container_name: pdfcraft
    restart: unless-stopped
    ports:
      - "8769:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.pdfcraft
  architectures:
    - amd64
    - arm64
  main: pdfcraft
  author: ArtCraft
  developer: ArtCraft
  category: Productivity
  title:
    en_US: PdfCraft
  tagline:
    en_US: "The PDF workbench"
    zh_CN: "PDF 工作台"
    ar_SA: "منصة عمل PDF"
    de_DE: "Die PDF-Werkstatt"
    es_ES: "El banco de trabajo para PDF"
    fr_FR: "L'atelier PDF"
    hu_HU: "A PDF-munkaállomás"
    it_IT: "Il banco di lavoro PDF"
    ru_RU: "Рабочее место для PDF"
    pl_PL: "Warsztat PDF"
    pt_BR: "A central de trabalho com PDF"
    sv_SE: "PDF-verkstaden"
    uk_UA: "Робоче місце для PDF"
  description:
    en_US: "The PDF workbench; an open-source, clean-room reimplementation of Adobe Acrobat, rebuilt in pure Rust."
    zh_CN: "PDF 工作台；Adobe Acrobat 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "منصة عمل PDF؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Adobe Acrobat، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Die PDF-Werkstatt; eine quelloffene Clean-Room-Neuimplementierung von Adobe Acrobat, komplett in reinem Rust neu aufgebaut."
    es_ES: "El banco de trabajo para PDF; una reimplementación de código abierto, tipo «clean-room», de Adobe Acrobat, reconstruida en Rust puro."
    fr_FR: "L'atelier PDF ; une réimplémentation open source « clean-room » d'Adobe Acrobat, reconstruite en Rust pur."
    hu_HU: "A PDF-munkaállomás; Adobe Acrobat nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Il banco di lavoro PDF; una reimplementazione open source «clean-room» di Adobe Acrobat, ricostruita in puro Rust."
    ru_RU: "Рабочее место для PDF; открытая clean-room-реимплементация Adobe Acrobat, заново написанная на чистом Rust."
    pl_PL: "Warsztat PDF; otwartoźródłowa reimplementacja „clean-room” programu Adobe Acrobat, napisana od nowa w czystym Rust."
    pt_BR: "A central de trabalho com PDF; uma reimplementação open source, em clean-room, do Adobe Acrobat, reconstruída em Rust puro."
    sv_SE: "PDF-verkstaden; en open source-reimplementering av Adobe Acrobat enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Робоче місце для PDF; відкрита clean-room-реімплементація Adobe Acrobat, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/PdfCraft/icon.svg
  # Quando tiver as screenshots, suba-as nesta pasta e remova o "#":
