name: wordcraft

services:
  wordcraft:
    image: ghcr.io/berg-maia/wordcraft-web:0.7.0
    container_name: wordcraft
    restart: unless-stopped
    ports:
      - "8773:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.wordcraft
  architectures:
    - amd64
    - arm64
  main: wordcraft
  author: ArtCraft
  developer: ArtCraft
  category: Productivity
  title:
    en_US: WordCraft
  tagline:
    en_US: "Writing and document design"
    zh_CN: "写作与文档设计"
    ar_SA: "الكتابة وتصميم المستندات"
    de_DE: "Schreiben und Dokumentgestaltung"
    es_ES: "Escritura y diseño de documentos"
    fr_FR: "Rédaction et mise en forme de documents"
    hu_HU: "Írás és dokumentumtervezés"
    it_IT: "Scrittura e progettazione di documenti"
    ru_RU: "Тексты и оформление документов"
    pl_PL: "Pisanie i projektowanie dokumentów"
    pt_BR: "Escrita e design de documentos"
    sv_SE: "Skrivande och dokumentdesign"
    uk_UA: "Тексти та оформлення документів"
  description:
    en_US: "Writing and document design; an open-source, clean-room reimplementation of Microsoft Word, rebuilt in pure Rust."
    zh_CN: "写作与文档设计；Microsoft Word 的开源净室（clean-room）重新实现，完全使用纯 Rust 重写。"
    ar_SA: "الكتابة وتصميم المستندات؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Microsoft Word، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Schreiben und Dokumentgestaltung; eine quelloffene Clean-Room-Neuimplementierung von Microsoft Word, komplett in reinem Rust neu aufgebaut."
    es_ES: "Escritura y diseño de documentos; una reimplementación de código abierto, tipo «clean-room», de Microsoft Word, reconstruida en Rust puro."
    fr_FR: "Rédaction et mise en forme de documents ; une réimplémentation open source « clean-room » de Microsoft Word, reconstruite en Rust pur."
    hu_HU: "Írás és dokumentumtervezés; Microsoft Word nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Scrittura e progettazione di documenti; una reimplementazione open source «clean-room» di Microsoft Word, ricostruita in puro Rust."
    ru_RU: "Тексты и оформление документов; открытая clean-room-реимплементация Microsoft Word, заново написанная на чистом Rust."
    pl_PL: "Pisanie i projektowanie dokumentów; otwartoźródłowa reimplementacja „clean-room” programu Microsoft Word, napisana od nowa w czystym Rust."
    pt_BR: "Escrita e design de documentos; uma reimplementação open source, em clean-room, do Microsoft Word, reconstruída em Rust puro."
    sv_SE: "Skrivande och dokumentdesign; en open source-reimplementering av Microsoft Word enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Тексти та оформлення документів; відкрита clean-room-реімплементація Microsoft Word, заново написана на чистому Rust."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/WordCraft/icon.svg
