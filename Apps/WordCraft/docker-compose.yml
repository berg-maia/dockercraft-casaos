name: wordcraft

services:
  wordcraft:
    image: ghcr.io/berg-maia/wordcraft-web:latest
    container_name: wordcraft
    restart: unless-stopped
    ports:
      - "8773:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.wordcraft
  architectures:
    - amd64
    - arm64
  main: wordcraft
  author: berg-maia
  developer: ArtCraft
  category: Productivity
  title:
    en_US: WordCraft
  tagline:
    en_US: "Word processing"
    zh_CN: "文字处理"
    ar_SA: "معالجة النصوص"
    de_DE: "Textverarbeitung"
    es_ES: "Procesamiento de textos"
    fr_FR: "Traitement de texte"
    hu_HU: "Szövegszerkesztés"
    it_IT: "Elaborazione di testi"
    ru_RU: "Текстовый процессор"
    pl_PL: "Edytor tekstu"
    pt_BR: "Processamento de texto"
    sv_SE: "Ordbehandling"
    uk_UA: "Текстовий процесор"
  description:
    en_US: "Word processing. A free alternative to Microsoft Word that runs entirely in your browser using WebAssembly."
    zh_CN: "文字处理。Microsoft Word 的免费替代品，借助 WebAssembly 完全在浏览器中运行。"
    ar_SA: "معالجة النصوص. بديل مجاني لبرنامج Microsoft Word يعمل بالكامل في المتصفح باستخدام WebAssembly."
    de_DE: "Textverarbeitung. Eine kostenlose Alternative zu Microsoft Word, die über WebAssembly vollständig im Browser läuft."
    es_ES: "Procesamiento de textos. Una alternativa gratuita a Microsoft Word que se ejecuta íntegramente en el navegador mediante WebAssembly."
    fr_FR: "Traitement de texte. Une alternative gratuite à Microsoft Word qui s'exécute entièrement dans le navigateur grâce à WebAssembly."
    hu_HU: "Szövegszerkesztés. Ingyenes alternatíva (Microsoft Word helyett), amely teljes egészében a böngészőben fut, WebAssembly segítségével."
    it_IT: "Elaborazione di testi. Un'alternativa gratuita a Microsoft Word che funziona interamente nel browser grazie a WebAssembly."
    ru_RU: "Текстовый процессор. Бесплатная альтернатива Microsoft Word, которая работает прямо в браузере благодаря WebAssembly."
    pl_PL: "Edytor tekstu. Darmowa alternatywa dla Microsoft Word, działająca w całości w przeglądarce dzięki WebAssembly."
    pt_BR: "Processamento de texto. Uma alternativa gratuita ao Microsoft Word que roda inteiramente no navegador, usando WebAssembly."
    sv_SE: "Ordbehandling. Ett gratis alternativ till Microsoft Word som körs helt i webbläsaren med WebAssembly."
    uk_UA: "Текстовий процесор. Безкоштовна альтернатива Microsoft Word, що працює повністю в браузері завдяки WebAssembly."
  icon: https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/WordCraft/icon.svg
  # Quando tiver as screenshots, suba-as nesta pasta e remova o "#":
  # screenshot_link:
  #   - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/WordCraft/screenshot-1.webp
  #   - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/WordCraft/screenshot-2.webp
  #   - https://raw.githubusercontent.com/berg-maia/dockercraft-casaos/main/Apps/WordCraft/screenshot-3.webp
  website: https://getartcraft.com/apps/wordcraft
  repo: https://github.com/storytold/wordcraft
  support: https://github.com/storytold/wordcraft/issues
  index: /
  port_map: "8773"
  scheme: http
