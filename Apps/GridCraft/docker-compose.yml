name: gridcraft

services:
  gridcraft:
    image: ghcr.io/berg-maia/gridcraft-web:0.12.1
    container_name: gridcraft
    restart: unless-stopped
    ports:
      - "8777:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "Web UI"
            pt_BR: "Interface web"

x-casaos:
  id: io.github.berg-maia.gridcraft
  architectures:
    - amd64
    - arm64
  main: gridcraft
  author: ArtCraft
  developer: ArtCraft
  category: Productivity
  title:
    en_US: GridCraft
  tagline:
    en_US: "Spreadsheets and data"
    zh_CN: "电子表格与数据"
    ar_SA: "جداول البيانات والبيانات"
    de_DE: "Tabellenkalkulation und Daten"
    es_ES: "Hojas de cálculo y datos"
    fr_FR: "Tableurs et données"
    hu_HU: "Táblázatok és adatok"
    it_IT: "Fogli di calcolo e dati"
    ru_RU: "Электронные таблицы и данные"
    pl_PL: "Arkusze kalkulacyjne i dane"
    pt_BR: "Planilhas e dados"
    sv_SE: "Kalkylblad och data"
    uk_UA: "Електронні таблиці та дані"
  description:
    en_US: "Spreadsheets and data; an open-source, clean-room reimplementation of Microsoft Excel, rebuilt in pure Rust."
