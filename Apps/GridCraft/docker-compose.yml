    ar_SA: "جداول البيانات والبيانات؛ إعادة تنفيذ مفتوحة المصدر بأسلوب «clean-room» لبرنامج Microsoft Excel، أُعيد بناؤها بلغة Rust الخالصة."
    de_DE: "Tabellenkalkulation und Daten; eine quelloffene Clean-Room-Neuimplementierung von Microsoft Excel, komplett in reinem Rust neu aufgebaut."
    es_ES: "Hojas de cálculo y datos; una reimplementación de código abierto, tipo «clean-room», de Microsoft Excel, reconstruida en Rust puro."
    fr_FR: "Tableurs et données ; une réimplémentation open source « clean-room » de Microsoft Excel, reconstruite en Rust pur."
    hu_HU: "Táblázatok és adatok; Microsoft Excel nyílt forráskódú, „clean-room” újraimplementációja, tiszta Rustban újraépítve."
    it_IT: "Fogli di calcolo e dati; una reimplementazione open source «clean-room» di Microsoft Excel, ricostruita in puro Rust."
    ru_RU: "Электронные таблицы и данные; открытая clean-room-реимплементация Microsoft Excel, заново написанная на чистом Rust."
    pl_PL: "Arkusze kalkulacyjne i dane; otwartoźródłowa reimplementacja „clean-room” programu Microsoft Excel, napisana od nowa w czystym Rust."
    pt_BR: "Planilhas e dados; uma reimplementação open source, em clean-room, do Microsoft Excel, reconstruída em Rust puro."
    sv_SE: "Kalkylblad och data; en open source-reimplementering av Microsoft Excel enligt clean-room-metoden, omskriven i rent Rust."
    uk_UA: "Електронні таблиці та дані; відкрита clean-room-реімплементація Microsoft Excel, заново написана на чистому Rust."
